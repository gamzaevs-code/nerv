<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">НЕРВ — neon cyberpunk monogram</title>
  <desc id="desc">Minimal transparent logo where Cyrillic letters Н Е Р В overlap into one esports-style symbol.</desc>
  <defs>
    <linearGradient id="nervGradient" x1="22" y1="28" x2="230" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AF6FF"/>
      <stop offset="0.45" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#007BFF"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="13" flood-color="#007BFF" flood-opacity="0.42"/>
    </filter>
    <filter id="hardGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00E5FF" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- angular cyber-sport cuts behind the letters; transparent outer background -->
  <path d="M33 54H218L235 74L219 91H52L33 73V54Z" fill="#00E5FF" fill-opacity="0.08"/>
  <path d="M23 184H203L226 205L208 226H43L23 205V184Z" fill="#007BFF" fill-opacity="0.08"/>

  <!-- overlapped Cyrillic monogram Н Е Р В -->
  <g filter="url(#glow)" transform="skewX(-8)">
    <text x="23" y="169"
      font-family="DejaVu-Sans-Bold, Inter, Geist, Arial, sans-serif"
      font-size="116"
      font-weight="950"
      letter-spacing="-31"
      fill="url(#nervGradient)"
      stroke="#A9FBFF"
      stroke-width="2.2"
      paint-order="stroke fill">НЕРВ</text>
  </g>

  <!-- sharp inner strokes to make the compact wordmark readable at small sizes -->
  <g filter="url(#hardGlow)" stroke="#00E5FF" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" opacity="0.95">
    <path d="M45 66V190"/>
    <path d="M45 126H89"/>
    <path d="M91 66V190"/>
    <path d="M112 66H172"/>
    <path d="M112 126H161"/>
    <path d="M112 190H176"/>
    <path d="M184 66V190"/>
    <path d="M184 66H213C229 66 239 77 239 92C239 108 228 119 212 119H184"/>
  </g>

  <!-- aggressive diagonal cuts -->
  <path d="M30 214L214 30" stroke="#7AF6FF" stroke-width="5" stroke-linecap="square" opacity="0.18"/>
  <path d="M62 224H197" stroke="#00E5FF" stroke-width="5" stroke-linecap="square" opacity="0.52"/>
  <path d="M48 32H205" stroke="#00E5FF" stroke-width="5" stroke-linecap="square" opacity="0.52"/>
</svg>
