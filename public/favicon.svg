<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">НЕРВ — логотип</title>
  <desc id="desc">Стилизованная кириллическая буква Н в круге, вдохновлённая символом Bitcoin, в неоново-синей цветовой схеме проекта.</desc>
  <defs>
    <linearGradient id="coin" x1="128" y1="80" x2="392" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AF6FF"/>
      <stop offset="0.42" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#007BFF"/>
    </linearGradient>
    <linearGradient id="coinDark" x1="140" y1="106" x2="384" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17243A"/>
      <stop offset="1" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="edge" x1="158" y1="96" x2="350" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FCFF"/>
      <stop offset="0.55" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0068D8"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00E5FF" flood-opacity="0.36"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00E5FF" flood-opacity="0.72"/>
    </filter>
  </defs>

  <!-- transparent outer canvas; dark inner coin keeps the mark crisp on any background -->
  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="214" fill="url(#coin)"/>
    <circle cx="256" cy="256" r="184" fill="url(#coinDark)"/>
    <circle cx="256" cy="256" r="183" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M114 256C114 177.6 177.6 114 256 114" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Bitcoin-like vertical rails behind the Cyrillic Н -->
  <g stroke="url(#edge)" stroke-width="26" stroke-linecap="round" opacity="0.82" filter="url(#innerGlow)">
    <path d="M206 126V386"/>
    <path d="M306 126V386"/>
  </g>

  <!-- Minimal geometric Cyrillic Н: two verticals + aggressive diagonal crossbars -->
  <g filter="url(#innerGlow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M184 142V370" stroke="#B8FCFF" stroke-width="34"/>
    <path d="M328 142V370" stroke="#B8FCFF" stroke-width="34"/>
    <path d="M184 245L328 198" stroke="url(#coin)" stroke-width="38"/>
    <path d="M184 314L328 267" stroke="url(#coin)" stroke-width="38"/>
    <path d="M184 142V370" stroke="url(#coin)" stroke-width="24"/>
    <path d="M328 142V370" stroke="url(#coin)" stroke-width="24"/>
  </g>

  <!-- subtle 3D bevel cuts -->
  <path d="M176 386H336" stroke="#7AF6FF" stroke-width="10" stroke-linecap="round" opacity="0.42"/>
  <path d="M176 126H336" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.26"/>
  <path d="M108 340C136 398 191 434 256 434C319 434 374 400 403 345" stroke="#007BFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
</svg>
